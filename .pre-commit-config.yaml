# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # To upgrade hooks run: `prek autoupdate --freeze`
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=750']
        exclude: ^uv.lock$
      - id: check-toml
      - id: check-yaml
        args: [ --unsafe ]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # frozen: v1.50.3
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: format
        name: check and reformat by ruff/ty/bandit
        entry: pdm run fast lint --ty --auto-bandit
        language: system
        types: [python]

      - id: pypi
        name: ensure pypi for uv lock
        entry: pdm run fast pypi --slim
        pass_filenames: false
        language: system

      - id: mypy
        name: Check type hints by mypy
        entry: just mypy
        language: system
        pass_filenames: false
        groups: [check]
        stages: [manual]

      - id: build
        name: Build sdist by uv
        entry: uv build
        language: system
        pass_filenames: false
        groups: [check]
        stages: [manual]

      - id: twine
        name: Check sdist by twine
        entry: pdm run twine check dist/*
        language: system
        pass_filenames: false
        priority: 20
        groups: [check]
        stages: [manual]
